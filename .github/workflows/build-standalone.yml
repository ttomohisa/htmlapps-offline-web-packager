name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "assets/**"
      - "tests/**"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "schemas/dependencies*.json"
      - ".github/workflows/dependency-updates.yml"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Set up Node.js for regression fixtures
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run Offline Web Packager regression fixtures
        shell: pwsh
        run: |
          node ./tests/foundation.test.cjs
          node ./tests/analyzer.test.cjs
          node ./tests/packager.test.cjs
          node ./tests/resolver.test.cjs
          node ./tests/verification.test.cjs
          node ./tests/ux.test.cjs
          node ./tests/performance.test.cjs
          node ./tests/cross-browser.test.cjs
          node ./tests/drop-regression.test.cjs
          node ./tests/i18n.test.cjs

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
